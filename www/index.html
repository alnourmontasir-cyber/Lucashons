<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<meta name="color-scheme" content="dark">
<meta name="description" content="سهم يدلّك على أي وجهة مع المسافة — يعمل بدون إنترنت">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GBS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cinzel:wght@700;900&family=Amiri:wght@700&display=swap">
<title>GBS المنتصر</title>
<!-- الأساس: ألوان الهوية (ذهبي / أسود / كحلي). باقي التصميم في css/luxe.css -->
<style>
:root{
  --bg:#070a12;--bg-elev:#0d1424;--surface:#101828;--surface-2:#131d31;--border:#223050;
  --text:#f4efe1;--text-dim:#98a3bb;--gold:#f2b705;--on-gold:#1f1500;--danger:#ff6b5b;
  --radius-sm:12px;--shadow:0 10px 30px rgba(0,0,0,.5);--font-scale:1;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:"Tajawal","Noto Kufi Arabic","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:15px;font-weight:500}
button,input,textarea,select{font-family:inherit;font-weight:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
input,textarea,select{width:100%;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-size:15px}
[hidden]{display:none !important}
</style>
</head>
<body>
<div id="funToolBackdrop" class="active">
  <header class="app-bar">
    <h1 id="funToolTitle">GBS</h1>
    <button type="button" class="icon-btn lx-ic-install" id="btnInstall" hidden title="تثبيت التطبيق" aria-label="تثبيت التطبيق"></button>
    <button type="button" class="icon-btn lx-ic-backup" id="btnBackup" title="النسخ الاحتياطي" aria-label="النسخ الاحتياطي"></button>
    <button type="button" class="icon-btn lx-ic-help" id="btnHelp" title="طريقة الاستخدام" aria-label="طريقة الاستخدام"></button>
  </header>
  <main id="funToolBody"></main>
</div>

<div class="backdrop" id="sheetBackdrop" role="dialog" aria-modal="true">
  <div class="box">
    <h3 id="sheetTitle"></h3>
    <div id="sheetBody"></div>
    <div class="row"><button type="button" class="btn btn-ghost" id="sheetClose">إغلاق</button></div>
  </div>
</div>

<div class="backdrop" id="confirmBackdrop" role="alertdialog" aria-modal="true">
  <div class="box">
    <h3 id="confirmTitle"></h3>
    <p id="confirmMsg"></p>
    <div class="row">
      <button type="button" class="btn btn-ghost" onclick="closeConfirm(false)">إلغاء</button>
      <button type="button" class="btn btn-primary" onclick="closeConfirm(true)">تأكيد</button>
    </div>
  </div>
</div>

<input type="file" id="bkFile" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/shim.js"></script>
<script src="js/geo.js"></script>
<script src="js/gps-tool.js"></script>
<!-- طبقة التصميم: تأتي بعد أنماط الأداة لتتقدّم عليها. لا تغيّر أي منطق -->
<link rel="stylesheet" href="css/luxe.css">
<script src="js/luxe.js"></script>
<script src="js/app.js"></script>
</body>
</html>
