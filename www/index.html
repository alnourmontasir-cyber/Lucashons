<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<meta name="color-scheme" content="dark">
<meta name="description" content="سهم يدلّك على أي وجهة مع المسافة — يعمل بدون إنترنت">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GBS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- [إصلاح الشاشة السوداء] الخطوط تُحمَّل دون أن تمنع رسم الصفحة: كانت الصفحة لا تظهر أبدًا إذا كان الإنترنت ضعيفًا -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cinzel:wght@700;900&family=Amiri:wght@700&display=swap" media="print" onload="this.media='all'">
<title>GBS المنتصر</title>
<!-- الأساس: ألوان الهوية (ذهبي / أسود / كحلي). باقي التصميم في css/luxe.css -->
<style>
:root{
  --bg:#070a12;--bg-elev:#0d1424;--surface:#101828;--surface-2:#131d31;--border:#223050;
  --text:#f4efe1;--text-dim:#98a3bb;--gold:#f2b705;--on-gold:#1f1500;--danger:#ff6b5b;
  --radius-sm:12px;--shadow:0 10px 30px rgba(0,0,0,.5);--font-scale:1;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:"Tajawal","Noto Kufi Arabic","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:15px;font-weight:500}
button,input,textarea,select{font-family:inherit;font-weight:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
input,textarea,select{width:100%;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-size:15px}
[hidden]{display:none !important}
/* شاشة التشغيل: تظهر فورًا، وتختفي بعد رسم الأداة، وتعرض «إعادة المحاولة» إن فشل شيء */
#boot{position:fixed;inset:0;z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;
  background:radial-gradient(90% 60% at 50% 35%,rgba(242,183,5,.14),transparent 60%),#070a12;transition:opacity .35s}
#boot.gone{opacity:0;pointer-events:none}
#boot .b-logo{font:900 34px/1.2 "Cinzel",Georgia,serif;letter-spacing:.16em;color:#ffd84a;text-shadow:0 0 22px rgba(242,183,5,.4)}
#boot .b-logo span{display:block;font:700 26px/1.4 "Amiri","Noto Naskh Arabic",serif;letter-spacing:0}
#boot .b-spin{width:46px;height:46px;border-radius:50%;border:3px solid rgba(242,183,5,.18);border-top-color:#f2b705;animation:bspin .9s linear infinite}
@keyframes bspin{to{transform:rotate(360deg)}}
#boot p{margin:0;color:#c9c0a0;font-size:14px;line-height:1.8;max-width:340px}
#boot button{min-height:48px;padding:10px 22px;border-radius:999px;font-size:15px;font-weight:800;margin:4px}
#bootRetry{color:#1f1500;background:linear-gradient(180deg,#ffe58a,#f7c51e 45%,#d99a00)}
#bootClear{color:#f4efe1;background:#131d31;border:1px solid #223050 !important}
#bootErr small{display:block;margin-top:8px;color:#7d879c;font-size:11px;direction:ltr;word-break:break-all}
</style>
</head>
<body>
<div id="boot" role="status" aria-live="polite">
  <div class="b-logo">GBS<span>المنتصر</span></div>
  <div class="b-spin" id="bootSpin"></div>
  <p id="bootMsg">جارٍ التشغيل…</p>
  <div id="bootErr" hidden>
    <p>تعذّر تشغيل التطبيق هذه المرة. بياناتك ووجهاتك محفوظة ولن تُحذف.</p>
    <div><button type="button" id="bootRetry">إعادة المحاولة</button><button type="button" id="bootClear">تحديث الملفات وإعادة التشغيل</button></div>
    <small id="bootErrTxt"></small>
  </div>
</div>
<script>
/* حارس التشغيل: يلتقط أخطاء التحميل ويمنع بقاء الشاشة فارغة */
(function () {
  var errs = [], done = false;
  window.__bootErrs = errs;
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && (t.src || t.href)) errs.push('تعذّر تحميل: ' + String(t.src || t.href).split('/').slice(-2).join('/'));
    else errs.push((e.message || 'خطأ') + (e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno : ''));
  }, true);
  function $(i) { return document.getElementById(i); }
  window.__bootDone = function () {
    if (done) return; done = true;
    var b = $('boot'); if (!b) return;
    b.classList.add('gone'); setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 450);
  };
  window.__bootFail = function (why) {
    if (done) return;
    if (why) errs.push(why);
    $('bootSpin').hidden = true; $('bootMsg').hidden = true; $('bootErr').hidden = false;
    $('bootErrTxt').textContent = errs.slice(-3).join(' | ');
  };
  $('bootRetry').onclick = function () { location.reload(); };
  $('bootClear').onclick = function () {
    var jobs = [];
    try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); })); } catch (e) {}
    try { if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); })); } catch (e) {}
    Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
  };
  /* إن لم تُرسم الأداة خلال 10 ثوانٍ نعرض الخيارات بدل شاشة فارغة */
  setTimeout(function () { if ($('gpsBody')) window.__bootDone(); else window.__bootFail('انتهت مهلة التشغيل'); }, 10000);
})();
</script>
<div id="funToolBackdrop" class="active">
  <header class="app-bar">
    <h1 id="funToolTitle">GBS</h1>
    <button type="button" class="icon-btn lx-ic-install" id="btnInstall" hidden title="تثبيت التطبيق" aria-label="تثبيت التطبيق"></button>
    <button type="button" class="icon-btn lx-ic-backup" id="btnBackup" title="النسخ الاحتياطي" aria-label="النسخ الاحتياطي"></button>
    <button type="button" class="icon-btn lx-ic-help" id="btnHelp" title="طريقة الاستخدام" aria-label="طريقة الاستخدام"></button>
  </header>
  <main id="funToolBody"></main>
</div>

<div class="backdrop" id="sheetBackdrop" role="dialog" aria-modal="true">
  <div class="box">
    <h3 id="sheetTitle"></h3>
    <div id="sheetBody"></div>
    <div class="row"><button type="button" class="btn btn-ghost" id="sheetClose">إغلاق</button></div>
  </div>
</div>

<div class="backdrop" id="confirmBackdrop" role="alertdialog" aria-modal="true">
  <div class="box">
    <h3 id="confirmTitle"></h3>
    <p id="confirmMsg"></p>
    <div class="row">
      <button type="button" class="btn btn-ghost" onclick="closeConfirm(false)">إلغاء</button>
      <button type="button" class="btn btn-primary" onclick="closeConfirm(true)">تأكيد</button>
    </div>
  </div>
</div>

<input type="file" id="bkFile" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/shim.js"></script>
<script src="js/geo.js"></script>
<script src="js/store.js"></script>
<script src="js/gps-tool.js"></script>
<!-- الوحدات الجديدة: الرحلات / الخريطة / الإضافات ووضع الصحراء — تُحمَّل قبل app.js الذي يرسم الأداة -->
<script src="js/trips.js"></script>
<script src="js/map.js"></script>
<script src="js/ext.js"></script>
<!-- طبقة التصميم: تأتي بعد أنماط الأداة لتتقدّم عليها. لا تغيّر أي منطق -->
<link rel="stylesheet" href="css/luxe.css">
<script src="js/luxe.js"></script>
<script src="js/app.js"></script>
</body>
</html>
