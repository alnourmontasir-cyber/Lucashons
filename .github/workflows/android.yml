name: بناء APK لأندرويد

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: تثبيت الحزم
        run: npm install

      - name: إنشاء مشروع أندرويد وإضافة أذونات الموقع
        run: npm run android:add

      - name: أيقونات التطبيق
        continue-on-error: true
        run: npm run android:icons

      - name: مزامنة الملفات
        run: npx cap sync android

      - name: بناء APK
        run: |
          chmod +x android/gradlew
          npm run apk
          cp android/app/build/outputs/apk/debug/app-debug.apk GBS-Almuntasir.apk

      - name: رفع الـ APK
        uses: actions/upload-artifact@v4
        with:
          name: GBS-Almuntasir-apk
          path: GBS-Almuntasir.apk

      - name: نشر إصدار (عند وسم v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GBS-Almuntasir.apk
